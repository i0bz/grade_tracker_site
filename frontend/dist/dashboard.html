<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <img src="assets/logo.svg" alt="logo" width="100" height="50">
            <h1 class="headline">Grade Tracker</h1>
            <div class="link-row">
                <a href="/subjects">Subjects</a>
                <a href="/logout">Logout</a>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="label">Subjects</div>
                <div class="value" id="subject_amount""></div>
            </div>
            <div class="summary-card">
                <div class="label">Average</div>
                <div class="value" id="gwa"></div>
            </div>
            <div class="summary-card">
                <div class="label">Highest Grade</div>
                <div class="value" id="highest_grade"></div>
            </div>
        </div>

        <section class="panel">
            <h2>Subjects Overview</h2>
            <div id="subjects_table">
                
            </div>
        </section>

    </div>


    <script src="js/dashboard.js" type="module"></script>
</body>
</html>
