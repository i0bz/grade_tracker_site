<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
    <div class="container card-container">
        <div class="topbar">
            <img src="assets/logo.svg" alt="logo" width="100" height="50">
            <h1 class="headline">Edit Subject</h1>
            <div class="link-row">
                <a href="/dashboard">Dashboard</a>
                <a href="/subjects">Subjects</a>
                <a href="/logout">Logout</a>
            </div>
        </div>

        <div class="auth-layout">
            <section class="panel">
                <h2>Edit Subject Schema</h2>
                <form id="edit_subject">
                    <label for="activity_split">Activity (%)</label>
                    <input id="activity_split" name="activity_split" type="number" min="0" max="100" value="30" required>
    
                    <label for="major_exam_split">Major Exam (%)</label>
                    <input id="major_exam_split" name="major_exam_split" type="number" min="0" max="100" value="40" required>
    
                    <label for="final_output_split">Final Output (%)</label>
                    <input id="final_output_split" name="final_output_split" type="number" min="0" max="100" value="30" required>
    
                    <button class="btn btn-primary" id="subject_submit" type="submit">Save schema</button>
                </form>
                <div id="subject_result_div"></div>
            </section>
            
            <section class="panel">
                <h2>Record Activity</h2>
                <form id="add_activity">
                    <label for="activity_name">Activity Name</label>
                    <input id="activity_name" name="activity_name" type="text" required>
    
                    <label for="activity_type">Activity Type</label>
                    <select name="activity_type" id="activity_type">
                        <option value="Activity">Activity</option>
                        <option value="Major Exam">Major Exam</option>
                        <option value="Final Output">Final Output</option>
                    </select>
                    <div class="form-grid">
                        <div>
                            <label for="points">Points Scored</label>
                            <input id="points" name="points"" type="number" min="0" value="0" required>
                        </div>
                        <div>
                            <label for="max_points">Max Points</label>
                            <input id="max_points" name="max_points" type="number" min="0" value="0" required>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="subject_submit" type="submit">Record Activity</button>
                </form>
                <div id="activity_result_div"></div>
            </section>

        </div>

        <section class="panel">
            <h2>Activity List</h2>
            <div id="activities_table">
            </div>
        </section>

    </div>

    <script src="js/edit.js" type="module"></script>

</body>
</html>
